<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelStudio – Euthenia Studio</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>PixelStudio</h1>
    </header>
    <main>
      <div class="toolbar">
        <div class="toolbar-group">
          <button data-tool="pen" class="active" title="Pen (P)">Pen</button>
          <button data-tool="fill" title="Fill (G)">Fill</button>
          <button data-tool="eraser" title="Eraser (E)">Erase</button>
        </div>
        <div class="toolbar-group palette" id="palette"></div>
        <div class="toolbar-group actions">
          <div class="color-indicator" id="colorIndicator"></div>
          <button id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
          <button id="clearBtn" title="Clear">Clear</button>
          <button id="exportBtn" title="Export PNG">Export</button>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="editorCanvas"></canvas>
        <canvas id="previewCanvas" class="preview" width="32" height="32"></canvas>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
<footer style="text-align:center;padding:1.5rem;font-size:0.75rem;color:#666;border-top:1px solid #222;margin-top:2rem"><a href="https://frteddz.github.io/Euthenia-Studio-Website/" style="color:#fbe134;text-decoration:none">Euthenia Studio</a> </body>mdash; privacy-first tools </body>amp; games</footer></body>
</html>
